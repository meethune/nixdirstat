[default]
extend-ignore-re = [
    # SHA hashes
    "[0-9a-f]{40}",
    # UUIDs
    "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}",
]

[files]
extend-exclude = [
    "target/",
    "*.lock",
    "*.svg",
    ".git/",
]

[default.extend-words]
# Project-specific words that are not typos
