---
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  meta:
    name: Resolve Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      binary_name: ${{ steps.meta.outputs.binary_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract metadata from Cargo.toml
        id: meta
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          NAME=$(grep '^name' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "binary_name=${NAME}" >> "$GITHUB_OUTPUT"

  generate-completions:
    name: Generate Shell Completions
    needs: [meta]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build native binary
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Generate completions
        run: |
          BINARY=target/x86_64-unknown-linux-musl/release/${{ needs.meta.outputs.binary_name }}
          mkdir -p completions
          "$BINARY" completions bash > completions/nixdirstat.bash
          "$BINARY" completions zsh  > completions/_nixdirstat
          "$BINARY" completions fish > completions/nixdirstat.fish
      - name: Upload completions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shell-completions
          path: completions/
          retention-days: 5

  build:
    name: Build (${{ matrix.target }})
    needs: [meta, generate-completions]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            binary_suffix: ""
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            binary_suffix: ""
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            binary_suffix: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            binary_suffix: ""
          - target: x86_64-unknown-freebsd
            os: ubuntu-latest
            binary_suffix: ""
            cross: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross-compilation tools
        if: matrix.cross
        uses: taiki-e/install-action@b6293e77ca553b1f0ddd57e0455a50317e979c25 # cross
      - name: Install musl tools
        if: contains(matrix.target, 'musl') && !matrix.cross
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build release binary
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - name: Download completions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shell-completions
          path: completions/
      - name: Package archive
        run: |
          BINARY="${{ needs.meta.outputs.binary_name }}"
          TARGET="${{ matrix.target }}"
          VERSION="${{ needs.meta.outputs.version }}"
          DIR="${BINARY}-v${VERSION}-${TARGET}"

          mkdir -p "${DIR}/completions"
          cp "target/${TARGET}/release/${BINARY}${{ matrix.binary_suffix }}" "${DIR}/"
          cp LICENSE README.md "${DIR}/"
          cp completions/* "${DIR}/completions/"

          ARCHIVE="${DIR}.tar.gz"
          tar czf "${ARCHIVE}" "${DIR}"
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: |
            *.tar.gz
            *.sha256
          retention-days: 5

  universal-macos:
    name: Universal macOS Binary
    needs: [meta, build]
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download x86_64 macOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-x86_64-apple-darwin
          path: x86_64/
      - name: Download aarch64 macOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-aarch64-apple-darwin
          path: aarch64/
      - name: Create universal binary
        env:
          BINARY: ${{ needs.meta.outputs.binary_name }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          DIR="${BINARY}-v${VERSION}-universal-apple-darwin"
          X86_DIR="${BINARY}-v${VERSION}-x86_64-apple-darwin"
          ARM_DIR="${BINARY}-v${VERSION}-aarch64-apple-darwin"

          # Extract arch-specific binaries
          tar xzf "x86_64/${X86_DIR}.tar.gz"
          tar xzf "aarch64/${ARM_DIR}.tar.gz"

          # Create universal binary via lipo
          mkdir -p "${DIR}/completions"
          lipo -create -output "${DIR}/${BINARY}" \
            "${X86_DIR}/${BINARY}" "${ARM_DIR}/${BINARY}"
          lipo -archs "${DIR}/${BINARY}"

          # Include docs and completions from the extracted archive
          cp "${X86_DIR}/LICENSE" "${X86_DIR}/README.md" "${DIR}/"
          cp "${X86_DIR}/completions/"* "${DIR}/completions/"

          # Package
          ARCHIVE="${DIR}.tar.gz"
          tar czf "${ARCHIVE}" "${DIR}"
          shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
      - name: Upload universal artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-universal-apple-darwin
          path: |
            *.tar.gz
            *.sha256
          retention-days: 5

  test:
    name: Test Release
    needs: [meta]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Run tests
        run: cargo test --features parallel

  audit:
    name: Audit Release
    needs: [meta]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo-audit
        uses: taiki-e/install-action@73a6fca0f83d7f929d18d0440a5d44807f6f0a97 # cargo-audit
      - name: Run audit
        run: cargo audit --deny warnings

  release:
    name: Create GitHub Release
    needs: [build, universal-macos, test, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist/
      - name: Generate checksums
        run: |
          cd dist
          cat *.sha256 > checksums-sha256.txt
      - name: Install git-cliff
        uses: taiki-e/install-action@24b35e792c4eb272ee06051198c72db034fd0be3 # git-cliff
        with:
          tool: git-cliff
      - name: Generate changelog
        run: git-cliff --latest --strip header > RELEASE_NOTES.md
      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/checksums-sha256.txt
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  update-homebrew:
    name: Update Homebrew Tap
    needs: [meta, release]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download release checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist/
      - name: Update Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN secret not configured, skipping tap update"
            exit 0
          fi

          # Collect checksums from per-target .sha256 files
          cd dist
          cat *.sha256 > checksums-sha256.txt
          cd ..

          # Prepare formula from template
          cp packaging/homebrew/nixdirstat.rb formula.rb
          sed -i "s/RELEASE_VERSION/${VERSION}/g" formula.rb

          # Replace each target's SHA256 placeholder
          for target_pair in \
            "SHA256_X86_64_LINUX_MUSL:x86_64-unknown-linux-musl" \
            "SHA256_AARCH64_LINUX_MUSL:aarch64-unknown-linux-musl" \
            "SHA256_X86_64_APPLE_DARWIN:x86_64-apple-darwin" \
            "SHA256_AARCH64_APPLE_DARWIN:aarch64-apple-darwin"; do
            PLACEHOLDER="${target_pair%%:*}"
            TARGET="${target_pair#*:}"
            HASH=$(grep "nixdirstat-v${VERSION}-${TARGET}.tar.gz" dist/checksums-sha256.txt | awk '{print $1}')
            if [ -n "$HASH" ]; then
              sed -i "s/${PLACEHOLDER}/${HASH}/g" formula.rb
            else
              echo "::error::No checksum found for ${TARGET}, aborting tap update"
              exit 1
            fi
          done

          # Verify no unresolved placeholders remain
          if grep -qE 'SHA256_' formula.rb; then
            echo "::error::Unresolved SHA256 placeholders in formula"
            exit 1
          fi

          # Clone and update tap
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/meethune/homebrew-nixdirstat.git" tap
          mkdir -p tap/Formula
          cp formula.rb tap/Formula/nixdirstat.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/nixdirstat.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged, skipping push"
          else
            git commit -m "nixdirstat ${VERSION}"
            git push
          fi
