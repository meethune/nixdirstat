---
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  meta:
    name: Resolve Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      binary_name: ${{ steps.meta.outputs.binary_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract metadata from Cargo.toml
        id: meta
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          NAME=$(grep '^name' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "binary_name=${NAME}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: [meta]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            binary_suffix: ""
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            binary_suffix: ""
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            binary_suffix: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            binary_suffix: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross-compilation tools
        if: matrix.cross
        uses: taiki-e/install-action@cross
      - name: Install musl tools
        if: contains(matrix.target, 'musl') && !matrix.cross
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build release binary
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - name: Package binary
        run: |
          BINARY="${{ needs.meta.outputs.binary_name }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE="${BINARY}-v${{ needs.meta.outputs.version }}-${TARGET}.tar.gz"
          cd target/${TARGET}/release
          tar czf "../../../${ARCHIVE}" "${BINARY}${{ matrix.binary_suffix }}"
          cd ../../..
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            *.tar.gz
            *.sha256
          retention-days: 5

  test:
    name: Test Release
    needs: [meta]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --all-features

  audit:
    name: Audit Release
    needs: [meta]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Run audit
        run: cargo audit --deny warnings

  release:
    name: Create GitHub Release
    needs: [build, test, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist/
      - name: Generate checksums
        run: |
          cd dist
          cat *.sha256 > checksums-sha256.txt
      - name: Generate changelog
        id: changelog
        run: |
          if command -v git-cliff &> /dev/null; then
            git-cliff --latest --strip header > RELEASE_NOTES.md
          else
            echo "Release ${{ github.ref_name }}" > RELEASE_NOTES.md
          fi
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/checksums-sha256.txt
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
