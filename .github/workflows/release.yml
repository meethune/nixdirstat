---
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  meta:
    name: Resolve Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      binary_name: ${{ steps.meta.outputs.binary_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract metadata from Cargo.toml
        id: meta
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          NAME=$(grep '^name' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "binary_name=${NAME}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: [meta]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            binary_suffix: ""
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            binary_suffix: ""
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            binary_suffix: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            binary_suffix: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross-compilation tools
        if: matrix.cross
        uses: taiki-e/install-action@b6293e77ca553b1f0ddd57e0455a50317e979c25 # cross
      - name: Install musl tools
        if: contains(matrix.target, 'musl') && !matrix.cross
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build release binary
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - name: Package binary
        run: |
          BINARY="${{ needs.meta.outputs.binary_name }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE="${BINARY}-v${{ needs.meta.outputs.version }}-${TARGET}.tar.gz"
          cd target/${TARGET}/release
          tar czf "../../../${ARCHIVE}" "${BINARY}${{ matrix.binary_suffix }}"
          cd ../../..
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: |
            *.tar.gz
            *.sha256
          retention-days: 5

  test:
    name: Test Release
    needs: [meta]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Run tests
        run: cargo test --features parallel

  audit:
    name: Audit Release
    needs: [meta]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo-audit
        uses: taiki-e/install-action@73a6fca0f83d7f929d18d0440a5d44807f6f0a97 # cargo-audit
      - name: Run audit
        run: cargo audit --deny warnings

  release:
    name: Create GitHub Release
    needs: [build, test, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist/
      - name: Generate checksums
        run: |
          cd dist
          cat *.sha256 > checksums-sha256.txt
      - name: Install git-cliff
        uses: taiki-e/install-action@24b35e792c4eb272ee06051198c72db034fd0be3 # git-cliff
        with:
          tool: git-cliff
      - name: Generate changelog
        run: git-cliff --latest --strip header > RELEASE_NOTES.md
      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/checksums-sha256.txt
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
