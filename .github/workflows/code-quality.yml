---
name: Code Quality Metrics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metrics:
    name: Collect Code Quality Metrics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Install analysis tools
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2
        with:
          tool: cargo-geiger,cargo-bloat
      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-metrics-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-metrics-
      - name: Scan for unsafe code
        run: |
          echo "## Unsafe Code Analysis" > metrics-report.md
          echo '```' >> metrics-report.md
          cargo geiger --features parallel >> metrics-report.md || true
          echo '```' >> metrics-report.md
          echo "" >> metrics-report.md
      - name: Analyze binary size
        run: |
          cargo build --release
          echo "## Binary Size Analysis" >> metrics-report.md
          echo '```' >> metrics-report.md
          cargo bloat --release --crates >> metrics-report.md
          echo '```' >> metrics-report.md
          echo "" >> metrics-report.md
      - name: Check documentation coverage
        run: |
          echo "## Documentation Coverage" >> metrics-report.md
          echo '```' >> metrics-report.md
          cargo doc --no-deps --features parallel 2>&1 | grep -E "Documenting|warning" >> metrics-report.md || true
          echo '```' >> metrics-report.md
      - name: Upload metrics report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-quality-metrics
          path: metrics-report.md
          retention-days: 30
