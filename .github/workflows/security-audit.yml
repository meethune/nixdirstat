---
name: Security Audit

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install cargo-audit
        uses: taiki-e/install-action@73a6fca0f83d7f929d18d0440a5d44807f6f0a97 # cargo-audit
      - name: Run security audit
        run: cargo audit --deny warnings
