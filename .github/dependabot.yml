version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "rust"
    groups:
      # Version updates — grouped by subsystem
      dev-dependencies:
        applies-to: version-updates
        patterns:
          - "proptest*"
          - "test-*"
          - "criterion*"
          - "tempfile*"
        update-types:
          - "minor"
          - "patch"
      async-runtime:
        applies-to: version-updates
        patterns:
          - "tokio*"
        update-types:
          - "minor"
          - "patch"
      tui:
        applies-to: version-updates
        patterns:
          - "ratatui*"
          - "crossterm*"
          - "streemap*"
        update-types:
          - "minor"
          - "patch"
      storage:
        applies-to: version-updates
        patterns:
          - "rusqlite*"
        update-types:
          - "minor"
          - "patch"
      serde-ecosystem:
        applies-to: version-updates
        patterns:
          - "serde*"
        update-types:
          - "minor"
          - "patch"
      system:
        applies-to: version-updates
        patterns:
          - "nix"
          - "libc"
        update-types:
          - "minor"
          - "patch"
      # Security updates — single grouped PR for all Rust advisories
      rust-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
