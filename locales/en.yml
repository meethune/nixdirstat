  en: " i              File info popup"
explorer.help.tree.preview:
  en: " v              Preview file"
explorer.help.tree.search:
  en: " /              Search / filter"

# Treemap panel keybindings
explorer.help.treemap.navigate:
  en: " ↑/↓/←/→ h/j/k/l  Navigate cells"
