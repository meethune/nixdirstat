# ---------------------------------------------------------------------------
# Explorer view — panel titles
# ---------------------------------------------------------------------------
explorer.panel.directory-tree:
  en: " Directory Tree "
explorer.panel.extensions:
  en: " Extensions "
explorer.panel.disk-usage:
  en: " Disk Usage "

# ---------------------------------------------------------------------------
